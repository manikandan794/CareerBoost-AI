{% extends "base.html" %}
{% block title %}Contact Us — CareerBoost AI{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="text-center mb-5 animate-fade-up">
    <h3 class="fw-bold">Get in Touch</h3>
    <p class="text-muted-custom">Questions, feedback, or partnership ideas — we'd love to hear from you.</p>
  </div>

  <div class="row g-4 justify-content-center">
    <div class="col-lg-5">
      <div class="card-cb p-4 h-100 animate-fade-up delay-1">
        <h6 class="fw-bold mb-3">Contact Information</h6>
        <p class="mb-3"><i class="bi bi-envelope text-primary-custom me-2"></i> support@careerboost.ai</p>
        <p class="mb-3"><i class="bi bi-telephone text-primary-custom me-2"></i> +91 98765 43210</p>
        <p class="mb-3"><i class="bi bi-geo-alt text-primary-custom me-2"></i> Chennai, Tamil Nadu, India</p>
        <hr>
        <div class="d-flex gap-3 fs-5">
          <a href="#" class="text-primary-custom"><i class="bi bi-linkedin"></i></a>
          <a href="#" class="text-primary-custom"><i class="bi bi-github"></i></a>
          <a href="#" class="text-primary-custom"><i class="bi bi-twitter-x"></i></a>
        </div>
      </div>
    </div>
    <div class="col-lg-6">
      <form method="POST" action="{{ url_for('main.contact') }}" class="card-cb p-4 animate-fade-up delay-2">
        <div class="mb-3">
          <label class="form-label">Your Name</label>
          <input type="text" name="name" class="form-control form-control-cb" value="{{ form.name or '' }}" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" name="email" class="form-control form-control-cb" value="{{ form.email or '' }}" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Subject</label>
          <input type="text" name="subject" class="form-control form-control-cb" value="{{ form.subject or '' }}">
        </div>
        <div class="mb-3">
          <label class="form-label">Message</label>
          <textarea name="message" rows="4" class="form-control form-control-cb" required>{{ form.message or '' }}</textarea>
        </div>
        <button type="submit" class="btn btn-primary-cb w-100">Send Message <i class="bi bi-send ms-1"></i></button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
