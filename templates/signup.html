{% extends "base.html" %}
{% block title %}Sign Up — CareerBoost AI{% endblock %}
{% block content %}
<div class="container">
  <div class="auth-card animate-fade-up">
    <div class="text-center mb-4">
      <i class="bi bi-rocket-takeoff-fill fs-1 text-primary-custom"></i>
      <h3 class="fw-bold mt-2">Create Your Account</h3>
      <p class="text-muted-custom">Start your placement preparation journey today</p>
    </div>
    <form method="POST" action="{{ url_for('auth.signup') }}" novalidate>
      <div class="mb-3">
        <label class="form-label">Full Name</label>
        <input type="text" class="form-control form-control-cb" name="full_name" value="{{ form.full_name or '' }}" placeholder="John Doe" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Email address</label>
        <input type="email" class="form-control form-control-cb" name="email" value="{{ form.email or '' }}" placeholder="you@example.com" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <div class="input-group">
          <input type="password" class="form-control form-control-cb" name="password" id="signupPassword" placeholder="At least 6 characters" required>
          <button class="btn btn-outline-cb toggle-password" type="button" data-target="#signupPassword"><i class="bi bi-eye"></i></button>
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label">Confirm Password</label>
        <input type="password" class="form-control form-control-cb" name="confirm_password" placeholder="Re-enter password" required>
      </div>
      <button type="submit" class="btn btn-primary-cb w-100 mt-2">Create Account <i class="bi bi-person-plus ms-1"></i></button>
    </form>
    <p class="text-center mt-4 mb-0 text-muted-custom">
      Already have an account? <a href="{{ url_for('auth.login') }}" class="text-primary-custom fw-semibold">Login</a>
    </p>
  </div>
</div>
{% endblock %}
